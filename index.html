<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>People by Year</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>People by Year</h1>
    <p class="subtitle">Select a year to view the names.</p>

    <section id="years" class="years"></section>

    <section id="peopleSection" class="people-section hidden">
      <button id="backButton" class="back-button">← Back to Years</button>
      <h2 id="selectedYear"></h2>
      <ol id="peopleList" class="people-list"></ol>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
